name: Build CoolKidz Menu

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "CoolKidz Menu.csproj"

      - name: Build
        run: dotnet publish "CoolKidz Menu.csproj" -c Release -r win-x64 --self-contained true -o publish

      - name: Upload CoolKidz Menu
        uses: actions/upload-artifact@v4
        with:
          name: CoolKidz-Menu
          path: publish/
